    <!-- Anti-FOUC Theme Script: Ngăn chớp trắng màn hình khi tải trang trong Dark Mode -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('theme_mode') || 'auto';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            var h = new Date().getHours();
            isDark = (h < 6 || h >= 18);
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
